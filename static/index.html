<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f4f0;
    --ink: #1c1e21;
    --muted: #6f7276;
    --rule: #dedcd5;
    --accent: #2f5d62;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Newsreader", Georgia, serif;
    font-size: 18px;
    line-height: 1.65;
  }
  .wrap {
    max-width: 42rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 9rem;
  }
  header { border-bottom: 1px solid var(--rule); padding-bottom: 1.25rem; margin-bottom: 2.5rem; }
  h1 { font-size: 1.6rem; font-weight: 500; margin: 0 0 .25rem; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: .85rem; }

  .empty { color: var(--muted); font-style: italic; }

  .turn { margin-bottom: 2.5rem; }
  .q {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: .95rem;
    font-weight: 500;
    border-left: 2px solid var(--accent);
    padding-left: 1rem;
    margin-bottom: 1rem;
  }
  .a { white-space: pre-wrap; }
  .a.pending { color: var(--muted); font-style: italic; }
  .a.error { color: #8a3324; font-family: "IBM Plex Sans", sans-serif; font-size: .9rem; }
  .meta {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: .75rem;
    color: var(--muted);
    margin-top: .75rem;
  }

  .bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-top: 1px solid var(--rule);
    padding: 1rem 1.5rem;
  }
  .bar-inner { max-width: 42rem; margin: 0 auto; display: flex; gap: .75rem; }
  input {
    flex: 1;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 1rem;
    padding: .7rem .9rem;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink);
    border-radius: 3px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: .95rem;
    padding: .7rem 1.4rem;
    border: none;
    border-radius: 3px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>StudyBot</h1>
    <p>Answers drawn from a corpus of arXiv papers on retrieval-augmented generation.</p>
  </header>
  <div id="log">
    <p class="empty">Ask a question to begin. Anything outside the papers gets turned down rather than guessed at.</p>
  </div>
</div>

<div class="bar">
  <div class="bar-inner">
    <input id="q" placeholder="Ask about the papers" autocomplete="off">
    <button id="send">Ask</button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('q');
const button = document.getElementById('send');

async function ask() {
  const text = input.value.trim();
  if (!text) return;

  const empty = log.querySelector('.empty');
  if (empty) empty.remove();

  const turn = document.createElement('div');
  turn.className = 'turn';
  const q = document.createElement('div');
  q.className = 'q';
  q.textContent = text;
  const a = document.createElement('div');
  a.className = 'a pending';
  a.textContent = 'Searching the papers...';
  turn.append(q, a);
  log.append(turn);

  input.value = '';
  input.disabled = true;
  button.disabled = true;
  window.scrollTo(0, document.body.scrollHeight);

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, n_results: 3 })
    });
    const data = await res.json();

    if (!res.ok) {
      a.className = 'a error';
      a.textContent = data.detail || 'Something went wrong. Try again.';
    } else {
      a.className = 'a';
      a.textContent = data.answer;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = data.chunks_used + ' passages retrieved';
      turn.append(meta);
    }
  } catch (e) {
    a.className = 'a error';
    a.textContent = 'Could not reach the server. Check it is running.';
  }

  input.disabled = false;
  button.disabled = false;
  input.focus();
  window.scrollTo(0, document.body.scrollHeight);
}

button.addEventListener('click', ask);
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
input.focus();
</script>
</body>
</html>
